    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }

    /* Selection */
    ::selection { background: var(--gold-soft); color: var(--bg); }

    /* Scroll smoothing */
    html { scroll-behavior: smooth; }

    /* Subtle fade-in on load */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .reveal { animation: fadeUp 1s cubic-bezier(.2,.7,.2,1) both; }
    .reveal-delay-1 { animation-delay: .15s; }
    .reveal-delay-2 { animation-delay: .3s; }
    .reveal-delay-3 { animation-delay: .45s; }
    .reveal-delay-4 { animation-delay: .6s; }

    /* Slow twinkle */
    @keyframes twinkle {
      0%, 100% { opacity: 0.3; }
      50%      { opacity: 1; }
    }
    /* Gentle float */
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-6px); }
    }
    /* Slow rotate for cosmic rings */

      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }

    .boot {
